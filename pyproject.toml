[project]
name = "fa-diacritizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saleh sepasi", email = "saleh.sepasi.ds@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.15.0+cpu",
    "transformers==5.22.2",
    "streamlit==1.67.0",
]

[project.scripts]
fa-diacritizer = "fa_diacritizer:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }